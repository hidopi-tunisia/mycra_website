services:
  # MySQL Database
  db:
    image: mysql:5.7
    container_name: mmb_db
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    ports:
      - "3311:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    networks:
      - mb_network

  # phpMyAdmin
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    container_name: mmb_phpmyadmin
    restart: always
    ports:
      - '8401:80'
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - /home/mmb-renov/mmb-wp/php.ini:/usr/local/etc/php/conf.d/php-custom.ini
    networks:
      - mb_network

  # WordPress
  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: mmb_wp
    ports:
      - '8400:80'
    restart: always
    volumes:
      - ./wordpress:/var/www/html
      - /home/mmb-renov/mmb-wp/php.ini:/usr/local/etc/php/conf.d/php-custom.ini
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    networks:
      - mb_network

volumes:
  db_data:

networks:
  mb_network:
